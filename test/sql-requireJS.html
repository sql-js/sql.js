<!doctype html>
<meta charset="utf-8" />
<title>RequireJS smoke test</title>
<script src="https://cdn.jsdelivr.net/npm/requirejs@2.3.8/require.js"></script>
<script>
require.config({ baseUrl: "../dist" });
require(["sql-wasm"], function (initSqlJs) {
    initSqlJs({ locateFile: function (file) { return "../dist/" + file; } })
        .then(function (SQL) {
            var db = new SQL.Database();
            var value = db.exec("SELECT 42")[0].values[0][0];
            db.close();
            if (value !== 42) throw new Error("Unexpected query result");
            document.body.style.backgroundColor = "green";
            document.body.textContent = "sql.js successfully loaded with AMD";
        }).catch(fail);
}, fail);
function fail(error) {
    document.body.style.backgroundColor = "red";
    document.body.textContent = "Module load failed: " + error;
    console.error(error);
}
</script>
<body>Loading sql.js through AMD...</body>
