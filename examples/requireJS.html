<meta charset="utf8" />
<html>
<script src='https://cdn.jsdelivr.net/npm/requirejs@2.3.8/require.js'></script>

<script>
  var baseUrl = '../dist'
  require.config({
    baseUrl: baseUrl
  });

  // The inline build includes WebAssembly in the JavaScript file.
  require(['sql-wasm-inline'],
    function success(initSqlJs) {
      console.log(typeof initSqlJs);
      if (typeof initSqlJs !== 'function') {
        document.body.style.backgroundColor = 'red';
        console.log('initSqlJs returned: ', initSqlJs);
        alert("Failed to require sql.js through AMD");
        return;
      }
      initSqlJs().then(function (SQL) {
        //Create the database
        var db = new SQL.Database();
        // Run a query without reading the results
        db.run("CREATE TABLE test (col1, col2);");
        // Insert two rows: (1,111) and (2,222)
        db.run("INSERT INTO test VALUES (?,?), (?,?)", [1, 111, 2, 222]);

        // Prepare a statement
        var stmt = db.prepare("SELECT * FROM test WHERE col1 BETWEEN $start AND $end");
        stmt.getAsObject({ $start: 1, $end: 1 }); // {col1:1, col2:111}

        // Bind new values
        stmt.bind({ $start: 1, $end: 2 });
        while (stmt.step()) { //
          var row = stmt.getAsObject();
          // [...] do something with the row of result
          console.log('Here is a row: ', row);
        }
      });
    },
    function error(err) {
      document.body.style.backgroundColor = 'red';
      console.log(err);
      alert("Module load failed: " + err);
    }
  );
</script>

<body>
  Output is in Javscript console
</body>

</html>
